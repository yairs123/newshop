version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: coin_marketplace
      POSTGRES_USER: coinuser
      POSTGRES_PASSWORD: coinpass123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinuser -d coin_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: coinmq
      RABBITMQ_DEFAULT_PASS: coinmq123
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    image: coinmarket-backend
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/coin_marketplace
      DB_USERNAME: coinuser
      DB_PASSWORD: coinpass123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQ_HOST: rabbitmq
      MQ_PORT: 5672
      MQ_USERNAME: coinmq
      MQ_PASSWORD: coinmq123
      ES_URIS: http://elasticsearch:9200
      JWT_SECRET: dev-secret-key-must-be-at-least-256-bits-long-for-hs256
      UPLOAD_DIR: /app/uploads
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - elasticsearch

  frontend-admin:
    build: ./frontend/admin
    ports:
      - "3001:80"
    depends_on:
      - backend

  frontend-seller:
    build: ./frontend/seller
    ports:
      - "3002:80"
    depends_on:
      - backend

  frontend-store:
    build: ./frontend/store
    ports:
      - "3003:80"
    depends_on:
      - backend

volumes:
  pgdata:
