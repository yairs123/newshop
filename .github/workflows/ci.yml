name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coin_marketplace
          POSTGRES_USER: coinuser
          POSTGRES_PASSWORD: coinpass123
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Backend tests
        working-directory: ./backend
        run: ./mvnw test
      - name: Backend build
        working-directory: ./backend
        run: ./mvnw package -DskipTests

  frontend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build

  frontend-seller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/seller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build

  frontend-store:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build
