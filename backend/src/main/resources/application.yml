spring:
  application:
    name: coin-marketplace
  profiles:
    active: dev

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Use ${DB_URL} in production
    url: jdbc:postgresql://localhost:5432/coin_marketplace
    # Use ${DB_USERNAME} in production
    username: coinuser
    # Use ${DB_PASSWORD} in production
    password: coinpass123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      # Use ${REDIS_HOST} in production
      host: localhost
      # Use ${REDIS_PORT} in production
      port: 6379
      timeout: 3000
      connect-timeout: 2000
  rabbitmq:
    # Use ${MQ_HOST} in production
    host: localhost
    # Use ${MQ_PORT} in production
    port: 5672
    # Use ${MQ_USERNAME} in production
    username: coinmq
    # Use ${MQ_PASSWORD} in production
    password: coinmq123
  elasticsearch:
    # Use ${ES_URIS} in production
    uris: http://localhost:9200

app:
  storage:
    type: local # local or s3
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: ${S3_BUCKET:coinmarket}
  jwt:
    # Use ${JWT_SECRET} in production
    secret: dev-secret-key-must-be-at-least-256-bits-long-for-hs256
    expiration-ms: 86400000
  file:
    # Use ${UPLOAD_DIR} in production
    upload-dir: ./uploads
    max-size: 10485760
  rating-api:
    ngc:
      base-url: https://api.ngccoin.com
      # Use ${NGC_API_KEY} in production
    pcgs:
      base-url: https://api.pcgs.com
      # Use ${PCGS_API_KEY} in production
    pmg:
      base-url: https://api.pmgnotes.com
      # Use ${PMG_API_KEY} in production

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${MQ_HOST}
    port: ${MQ_PORT}
    username: ${MQ_USERNAME}
    password: ${MQ_PASSWORD}
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}

app:
  storage:
    type: ${STORAGE_TYPE:local} # local or s3
    s3:
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      bucket: ${S3_BUCKET:coinmarket}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  file:
    upload-dir: ${UPLOAD_DIR:/data/uploads}
    max-size: 10485760
  rating-api:
    ngc:
      base-url: https://api.ngccoin.com
      api-key: ${NGC_API_KEY}
    pcgs:
      base-url: https://api.pcgs.com
      api-key: ${PCGS_API_KEY}
    pmg:
      base-url: https://api.pmgnotes.com
      api-key: ${PMG_API_KEY}
